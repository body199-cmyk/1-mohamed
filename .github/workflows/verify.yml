name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, packages, PostgreSQL and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm run check
      - name: Verify isolated PostgreSQL migrations and suites
        run: npm run db:verify
      - name: Verify negative controls actually catch regressions
        run: |
          npm run db:verify:negative
          npm run db:verify:negative-b
          npm run db:verify:negative-c
      - name: Check exact cash-opening validation (unit tests)
        run: npx vitest run apps/web/e2e/master-data-validation.test.ts
      - name: Check daily work report against original accounting engine
        run: npx vitest run apps/web/e2e/daily-work-validation.test.ts
      - name: Check D16 demo payment ledger and isolated accounts
        run: npx vitest run apps/web/e2e/payments-validation.test.ts
      - name: Build preview web app
        run: npm run build
      - name: Verify new Supabase SDK remains inactive before real Auth E2E
        run: node tools/auth-sdk-boundary-check.mjs
      - name: Verify fail-closed auth boundary over HTTP
        run: |
          npm run start --workspace=web -- --port 39123 > /tmp/next-auth-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/auth-boundary-smoke.mjs http://127.0.0.1:39123
      - name: Install isolated Chromium browser for UI regression
        run: npx playwright install chromium
      - name: Test master-data demo interactions in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/master-data.spec.ts e2e/daily-work.spec.ts e2e/statement-image.spec.ts e2e/payments.spec.ts

