name: Verify pull request

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_reader_drill:
        description: Export an encrypted trial snapshot with the approved temporary reader
        type: boolean
        default: false
      run_recurring_drill:
        description: Test the daily backup path with deletion disabled
        type: boolean
        default: false
      run_plain_drill:
        description: Verify plain business and Excel test copies in the isolated Drive drill folder
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-v2-${{ github.workflow }}-${{ github.ref }}-${{ inputs.run_reader_drill || false }}-${{ inputs.run_recurring_drill || false }}-${{ inputs.run_plain_drill || false }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ inputs.run_reader_drill != true && inputs.run_recurring_drill != true && inputs.run_plain_drill != true }}
    name: Typecheck, packages, PostgreSQL and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify real-data handoff gate cannot falsely pass
        run: node --test tools/production-preflight.test.mjs
      - name: Typecheck and unit tests
        run: npm run check
      - name: Verify all web and permanent-workspace contracts
        run: npm run test:web
      - name: Verify isolated PostgreSQL migrations and suites
        run: npm run db:verify
      - name: Verify negative controls actually catch regressions
        run: |
          npm run db:verify:negative
          npm run db:verify:negative-b
          npm run db:verify:negative-c
      - name: Check exact cash-opening validation (unit tests)
        run: npx vitest run apps/web/e2e/master-data-validation.test.ts
      - name: FIN-03 verify cash opening and trip write boundary (Vitest)
        run: npx vitest run apps/web/e2e/trip-cash-opening-validation.test.ts
      - name: Check daily work report against original accounting engine
        run: npx vitest run apps/web/e2e/daily-work-validation.test.ts
      - name: Check visible contractor opening balance
        run: npx vitest run apps/web/e2e/statement-opening-summary.test.tsx
      - name: Check D16 demo payment ledger and isolated accounts
        run: npx vitest run apps/web/e2e/payments-validation.test.ts
      - name: FIN-01 FIN-02 verify audited payment edit operation
        run: npx vitest run apps/web/e2e/payment-operations-validation.test.ts
      - name: CASH-LABEL-01 verify cash movement identifiers (Vitest)
        run: npx vitest run apps/web/e2e/cash-movement-label-validation.test.ts
      - name: Validate vehicle cash report against existing ledger
        run: npx vitest run apps/web/e2e/vehicle-cash-report-validation.test.ts
      - name: Verify dashboard shows work and payments separately
        run: npx vitest run apps/web/e2e/dashboard-validation.test.ts
      - name: Validate paginated PDF byte structure and complete row coverage
        run: npx vitest run packages/statement-export/tests/pdf-rendering.test.ts
      - name: Validate XLSX files preserve exact Arabic text and ZIP structure
        run: npx vitest run packages/statement-export/tests/xlsx-rendering.test.ts
      - name: Test versioned backup, tampering, isolated atomic restore and stale replay
        run: node --test tools/backup-core.test.mjs
      - name: Test daily Google Drive backup contract and 30-day retention
        run: node --test tools/offsite-backup.test.mjs tools/backup-reader/contract.test.mjs tools/backup-reader/restore-contract.test.mjs
      - name: Validate offsite backup workflow script syntax
        run: |
          npm ci --prefix tools/backup-reader --ignore-scripts --no-audit --no-fund
          node --test tools/backup-reader/recurring.test.mjs
          node --max-old-space-size=256 --max-semi-space-size=2 --test tools/backup-reader/business-backup.test.mjs
          node --check tools/offsite-backup.mjs
          node --check tools/google-drive-rclone.mjs
      - name: Build preview web app
        run: npm run build
      - name: Verify new Supabase SDK remains inactive before real Auth E2E
        run: node tools/auth-sdk-boundary-check.mjs
      - name: Verify fail-closed auth boundary over HTTP
        run: |
          npm run start --workspace=web -- --port 39123 > /tmp/next-auth-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/auth-boundary-smoke.mjs http://127.0.0.1:39123
      - name: Prove real-data switch alone cannot expose financial data
        run: |
          APP_ENABLE_REAL_DATA=true npm run start --workspace=web -- --port 39124 > /tmp/next-cutover-negative.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/auth-cutover-smoke.mjs http://127.0.0.1:39124
      - name: Install isolated Chromium browser for UI regression
        run: npx playwright install chromium
      - name: Test private workspace components with isolated HTTP fixtures
        run: npm run test:workspace
      - name: Keep exact-head private workspace visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr87-exact-head-ui-review
          path: artifacts/ui-review-87/
          if-no-files-found: error
          retention-days: 7
      - name: Test password recovery, visibility and optional remembered sessions
        run: npx playwright test --config=playwright.auth.config.ts
      - name: Keep login and automatic theme review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-theme-review
          path: artifacts/login-theme/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep private workspace browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-supabase-workspace-browser
          path: artifacts/closeout/
          if-no-files-found: ignore
          retention-days: 7
      - name: Test approved mobile trip entry and FIN-03 opening rejection
        run: npx playwright test --config=playwright.ui.config.ts e2e/trip-entry-stage2.spec.ts e2e/trip-cash-opening-fin03.spec.ts
      - name: Test canonical payment preview and UI-01 labeled assertions
        run: npx playwright test --config=playwright.ui.config.ts e2e/payment-preview-stage3.spec.ts
      - name: Test master-data demo interactions in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/master-data.spec.ts e2e/daily-work.spec.ts e2e/statement-image.spec.ts e2e/payments.spec.ts e2e/vehicle-cash.spec.ts e2e/dashboard.spec.ts e2e/statement-pdf.spec.ts e2e/statement-xlsx.spec.ts e2e/quality-h055.spec.ts e2e/design-h056.spec.ts e2e/forms-h057.spec.ts e2e/reports-h058.spec.ts e2e/visual-audit-h059.spec.ts e2e/h060-tabler-identity.spec.ts e2e/h061-operational-forms.spec.ts e2e/h062-device-independent-reports.spec.ts e2e/h063-contractor-signed-receipts.spec.ts

      - name: Test optional complete report history
        run: npx playwright test --config=playwright.ui.config.ts e2e/report-all-history.spec.ts

      - name: Test cross-feature regressions and H063 CSV export in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/review-regressions.spec.ts

      - name: Test H065 daily and vehicle cash exports across devices and themes
        run: npx playwright test --config=playwright.ui.config.ts e2e/h065-daily-vehicle-report-exports.spec.ts

      - name: Preserve H065 operational report exports for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h065-daily-vehicle-cash-five-exports
          path: artifacts/h065/
          if-no-files-found: ignore
          retention-days: 7


      - name: Keep demo design screenshots for review without Vercel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h056-demo-design-screenshots
          path: artifacts/h056/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H057 form screenshots for offline user review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h057-demo-forms-screenshots
          path: artifacts/h057/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H058 report mock screenshots for review without Vercel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h058-demo-report-screenshots
          path: artifacts/h058/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Keep H059 seven-route visual review matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h059-precloud-seven-route-visual-matrix
          path: artifacts/h059/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H060 Tabler-inspired RTL identity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h060-tabler-rtl-identity
          path: artifacts/h060/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H061 operational forms UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h061-tabler-operational-forms
          path: artifacts/h061/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H062 fixed-export and responsive report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h062-fixed-device-independent-reports
          path: artifacts/h062/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H063 signed-contractor report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h063-signed-contractor-receipts
          path: artifacts/h063/
          if-no-files-found: ignore
          retention-days: 7

  plain-drill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_plain_drill == true && inputs.run_reader_drill != true && inputs.run_recurring_drill != true && github.ref == 'refs/heads/codex/plain-backup-excel' }}
    name: Verify recovery archive and Excel in Drive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-drive-backup
    concurrency:
      group: production-google-drive-backup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/install-backup-tools
      - name: Send only business recovery files to the private Drive drill folder and verify
        env:
          PLAIN_BACKUP_DRILL: 'true'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
        run: node tools/backup-reader/business-drill.mjs

  recurring-drill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_recurring_drill == true && inputs.run_reader_drill != true && github.ref == 'refs/heads/feat/offsite-backup-t10-20261117' }}
    name: Manual backup on the daily path
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-drive-backup
    concurrency:
      group: production-google-drive-backup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install encryption, Drive and pinned reader tools
        uses: ./.github/actions/install-backup-tools
      - name: Run the daily backup path without scheduling or deletion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
          BACKUP_RETENTION_ENABLED: ${{ vars.BACKUP_RETENTION_ENABLED }}
          BACKUP_RECORD_HISTORY: 'true'
          BACKUP_RECURRING_DRILL: 'true'
        run: node tools/backup-reader/recurring.mjs

  reader-drill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reader_drill == true && inputs.run_recurring_drill != true && github.ref == 'refs/heads/feat/offsite-backup-t10-20261117' }}
    name: Manual encrypted reader trial
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-drive-backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned reader tools
        run: npm ci --prefix tools/backup-reader --ignore-scripts --no-audit --no-fund
      - name: Install encryption and Drive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age rclone
      - name: Export one consistent read-only snapshot and encrypt
        id: export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          BACKUP_READER_TRIAL: 'true'
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_RECORD_HISTORY: ${{ vars.BACKUP_RECORD_HISTORY }}
          BACKUP_RETENTION_ENABLED: ${{ vars.BACKUP_RETENTION_ENABLED }}
          BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
        run: node tools/backup-reader/export.mjs
      - name: Upload encrypted trial to Drive and download for SHA-256 verification
        timeout-minutes: 5
        env:
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
          ENCRYPTED_ARCHIVE: ${{ steps.export.outputs.archive }}
        run: node tools/backup-reader/drive-trial.mjs
