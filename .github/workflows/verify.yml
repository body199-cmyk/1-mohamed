name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, packages, PostgreSQL and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: npm run check
      - name: Verify isolated PostgreSQL migrations and suites
        run: npm run db:verify
      - name: Verify negative controls actually catch regressions
        run: |
          npm run db:verify:negative
          npm run db:verify:negative-b
          npm run db:verify:negative-c
      - name: Check exact cash-opening validation (unit tests)
        run: npx vitest run apps/web/e2e/master-data-validation.test.ts
      - name: Check daily work report against original accounting engine
        run: npx vitest run apps/web/e2e/daily-work-validation.test.ts
      - name: Check D16 demo payment ledger and isolated accounts
        run: npx vitest run apps/web/e2e/payments-validation.test.ts
      - name: Validate vehicle cash report against existing ledger
        run: npx vitest run apps/web/e2e/vehicle-cash-report-validation.test.ts
      - name: Verify dashboard shows work and payments separately
        run: npx vitest run apps/web/e2e/dashboard-validation.test.ts
      - name: Validate paginated PDF byte structure and complete row coverage
        run: npx vitest run packages/statement-export/tests/pdf-rendering.test.ts
      - name: Validate XLSX files preserve exact Arabic text and ZIP structure
        run: npx vitest run packages/statement-export/tests/xlsx-rendering.test.ts
      - name: Test versioned backup, tampering, isolated atomic restore and stale replay
        run: node --test tools/backup-core.test.mjs
      - name: Build preview web app
        run: npm run build
      - name: Verify new Supabase SDK remains inactive before real Auth E2E
        run: node tools/auth-sdk-boundary-check.mjs
      - name: Verify fail-closed auth boundary over HTTP
        run: |
          npm run start --workspace=web -- --port 39123 > /tmp/next-auth-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/auth-boundary-smoke.mjs http://127.0.0.1:39123
      - name: Install isolated Chromium browser for UI regression
        run: npx playwright install chromium
      - name: Test master-data demo interactions in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/master-data.spec.ts e2e/daily-work.spec.ts e2e/statement-image.spec.ts e2e/payments.spec.ts e2e/vehicle-cash.spec.ts e2e/dashboard.spec.ts e2e/statement-pdf.spec.ts e2e/statement-xlsx.spec.ts e2e/quality-h055.spec.ts e2e/design-h056.spec.ts e2e/forms-h057.spec.ts e2e/reports-h058.spec.ts e2e/visual-audit-h059.spec.ts e2e/h060-tabler-identity.spec.ts e2e/h061-operational-forms.spec.ts e2e/h062-device-independent-reports.spec.ts e2e/h063-contractor-signed-receipts.spec.ts

      - name: Test stage 3 cash preview in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/payment-preview-stage3.spec.ts

      - name: Test cross-feature regressions and H063 CSV export in real browser
        run: npx playwright test --config=playwright.ui.config.ts e2e/review-regressions.spec.ts

      - name: Test H065 daily and vehicle cash exports across devices and themes
        run: npx playwright test --config=playwright.ui.config.ts e2e/h065-daily-vehicle-report-exports.spec.ts

      - name: Preserve H065 operational report exports for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h065-daily-vehicle-cash-five-exports
          path: artifacts/h065/
          if-no-files-found: ignore
          retention-days: 7


      - name: Keep demo design screenshots for review without Vercel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h056-demo-design-screenshots
          path: artifacts/h056/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H057 form screenshots for offline user review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h057-demo-forms-screenshots
          path: artifacts/h057/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H058 report mock screenshots for review without Vercel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h058-demo-report-screenshots
          path: artifacts/h058/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Keep H059 seven-route visual review matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h059-precloud-seven-route-visual-matrix
          path: artifacts/h059/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep H060 Tabler-inspired RTL identity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h060-tabler-rtl-identity
          path: artifacts/h060/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H061 operational forms UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h061-tabler-operational-forms
          path: artifacts/h061/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H062 fixed-export and responsive report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h062-fixed-device-independent-reports
          path: artifacts/h062/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve H063 signed-contractor report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h063-signed-contractor-receipts
          path: artifacts/h063/
          if-no-files-found: ignore
          retention-days: 7
