name: One-time isolated Drive recovery drill
on:
  push:
    branches: [codex/recovery-drill-20261120]
    paths: [.github/workflows/recovery-drill-20261120.yml]

permissions:
  contents: read

concurrency:
  group: production-google-drive-backup
  cancel-in-progress: false

jobs:
  isolated-recovery:
    if: ${{ github.event.head_commit.message == 'Run isolated Drive recovery drill for 2026-11-20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: google-drive-backup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 34fe885c69fc67e0e281faf0d80ce62082a454b5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and backup tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/install-backup-tools
      - name: Verify the isolated read-only recovery contract
        run: node --test tools/backup-reader/cloud-rehearsal-contract.test.mjs
      - name: Restore and verify the selected archive in disposable PostgreSQL
        env:
          BACKUP_REHEARSAL_ONLY: 'true'
          BACKUP_REHEARSAL_DATE: '2026-11-20'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
        run: node --max-old-space-size=256 --max-semi-space-size=2 tools/backup-reader/cloud-rehearsal.mjs
