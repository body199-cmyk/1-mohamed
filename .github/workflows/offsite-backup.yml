name: Encrypted Google Drive database backup

on:
  schedule:
    # One daily snapshot at 01:17 UTC (03:17 Cairo during UTC+2).
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-google-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/offsite-backup-t10-20261117')) ||
      (github.event_name == 'schedule' && vars.BACKUP_ENABLED == 'true' && vars.BACKUP_RESTORE_VERIFIED == 'true' && vars.BACKUP_RECORD_HISTORY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-drive-backup
    steps:
      - name: Checkout selected reviewed branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install age encryption
        run: |
          sudo apt-get update
          sudo apt-get install --yes age rclone
      - name: Create full logical backup, encrypt, upload and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
          BACKUP_RETENTION_ENABLED: ${{ vars.BACKUP_RETENTION_ENABLED }}
          BACKUP_RECORD_HISTORY: ${{ vars.BACKUP_RECORD_HISTORY }}
        run: node tools/offsite-backup.mjs
