name: Encrypted Google Drive database backup

on:
  schedule:
    # One daily snapshot at 01:17 UTC (03:17 Cairo during UTC+2).
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-google-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && vars.BACKUP_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-drive-backup
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
      - name: Install age encryption
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
      - name: Create full logical backup, encrypt, upload and verify
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/offsite-backup.mjs
