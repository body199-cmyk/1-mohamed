name: Emergency recovery to a separate empty Supabase project (never production)

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: "Google Drive backup date (YYYY-MM-DD)"
        type: string
        required: true
      recovery_target_ref:
        description: "20-letter REF of a DIFFERENT, empty and freshly migrated Supabase project"
        type: string
        required: true
      source_database_unavailable:
        description: "Original DB is gone. Use Drive archive without querying backup_history"
        type: boolean
        default: false
      expected_sha256:
        description: "Trusted prior SHA-256; recommended, can be blank only with extra confirmation"
        type: string
        required: false
      unverified_archive_confirmation:
        description: "Only if original DB gone AND hash unavailable: I_ACCEPT_UNVERIFIED_SOURCE_TO_EMPTY_TARGET_ONLY"
        type: string
        required: false
      confirmation:
        description: "Type RESTORE_TO_EMPTY_SEPARATE_PROJECT — never reuse source project"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-google-drive-backup
  cancel-in-progress: false

jobs:
  restore-into-empty-isolated-project:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'RESTORE_TO_EMPTY_SEPARATE_PROJECT' }}
    name: Recover nine business tables to separate empty project — no application cutover
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: google-drive-backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install tested locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned backup tools, rclone and PostgreSQL client
        uses: ./.github/actions/install-backup-tools
      - name: Check isolated target and no-source recovery security contracts
        run: |
          node --test tools/backup-reader/disaster-recovery.test.mjs tools/backup-reader/cloud-rehearsal-contract.test.mjs
          node --check tools/backup-reader/restore-selected-drive-to-empty-target.mjs
          node --check tools/backup-reader/disaster-recovery.mjs
      - name: Download selected Drive archive and recover into separate empty project
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          BACKUP_REHEARSAL_ONLY: 'true'
          BACKUP_REHEARSAL_DATE: ${{ inputs.backup_date }}
          BACKUP_RESTORE_TARGET_ONLY: 'true'
          RESTORE_TARGET_CONFIRMATION: ${{ inputs.confirmation }}
          RESTORE_TARGET_REF: ${{ inputs.recovery_target_ref }}
          RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_DISASTER_SOURCE_UNAVAILABLE: ${{ inputs.source_database_unavailable }}
          BACKUP_DISASTER_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          BACKUP_DISASTER_UNVERIFIED_CONFIRMATION: ${{ inputs.unverified_archive_confirmation }}
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_DRIVE_CLIENT_SECRET }}
        run: |
          if [[ "${{ inputs.source_database_unavailable }}" == "true" ]]; then
            node --max-old-space-size=256 --max-semi-space-size=2 tools/backup-reader/disaster-recovery.mjs
          else
            node --max-old-space-size=256 --max-semi-space-size=2 tools/backup-reader/restore-selected-drive-to-empty-target.mjs
          fi
